# Sube el App Bundle a la prueba interna de Google Play.
# Se lanza a mano: pestaña Actions → "Subir a Play (prueba interna)" → Run workflow.
name: Subir a Play (prueba interna)

on:
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Bajar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Preparar conexiones y firma
        env:
          ENTORNOS_JSON: ${{ secrets.ENTORNOS_JSON }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ENTORNOS_JSON"
          test -n "$KEY_PROPERTIES"
          test -n "$KEYSTORE_BASE64"
          printf '%s\n' "$ENTORNOS_JSON" > config/entornos.json
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks

      - name: Compilar App Bundle
        run: flutter build appbundle --release --dart-define-from-file=config/entornos.json

      - name: Subir a prueba interna
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: virtus.apk
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ github.run_number }}
